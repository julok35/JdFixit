<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="Schéma animé d'une imprimante 3D en cours d'impression : le portique monte et la pièce se construit couche par couche">
  <defs>
    <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line y2="6" stroke="#1b1c1e" stroke-opacity=".14"/>
    </pattern>
    <clipPath id="build">
      <rect class="reveal" x="188" y="92" width="104" height="64"/>
    </clipPath>
  </defs>
  <style>
    /* Cycle de 9 s : le portique monte, la pièce se révèle couche par
       couche, la pièce est retirée, on recommence. */
    .gantry { animation: jdRise 9s cubic-bezier(.45,0,.55,1) infinite; }
    .reveal { animation: jdBuild 9s cubic-bezier(.45,0,.55,1) infinite; }
    .part   { animation: jdClear 9s linear infinite; }
    .head   { animation: jdSweep 1.6s ease-in-out infinite alternate; }
    .drip   { animation: jdDrip 1.6s ease-in infinite; }
    .led    { animation: jdBlink 2.4s steps(1, end) infinite; }
    @keyframes jdRise  { 0%, 4% { transform: translateY(60px); } 78%, 88% { transform: translateY(0); } 100% { transform: translateY(60px); } }
    @keyframes jdBuild { 0%, 4% { transform: translateY(64px); } 78%, 100% { transform: translateY(0); } }
    @keyframes jdClear { 0%, 84% { opacity: 1; } 93%, 100% { opacity: 0; } }
    @keyframes jdSweep { from { transform: translateX(-46px); } to { transform: translateX(46px); } }
    @keyframes jdDrip  { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(7px); } }
    @keyframes jdBlink { 0%, 55% { opacity: 1; } 55.01%, 100% { opacity: .18; } }
    @media (prefers-reduced-motion: reduce) {
      .gantry, .reveal, .part, .head, .drip, .led { animation: none; }
    }
  </style>
  <g fill="none" stroke="#1b1c1e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-.6 240 100)">
    <!-- châssis, chambre fermée, baie technique -->
    <rect x="142" y="18" width="196" height="156"/>
    <path d="M151 164h178" stroke-width="1.2"/>
    <rect x="151" y="164" width="178" height="10" fill="url(#h)" stroke="none"/>
    <circle class="led" cx="240" cy="28" r="3.2" fill="#e2562b" stroke="#e2562b" stroke-width="1.4"/>
    <!-- plateau chauffant -->
    <path d="M158 156h164" stroke-width="2.6"/>
    <!-- pièce imprimée, révélée couche par couche -->
    <g class="part" clip-path="url(#build)" stroke-width="1.2">
      <rect x="196" y="150" width="88" height="5"/>
      <rect x="196" y="144" width="88" height="5"/>
      <rect x="196" y="138" width="88" height="5"/>
      <rect x="196" y="132" width="88" height="5"/>
      <rect x="196" y="126" width="88" height="5"/>
      <rect x="196" y="120" width="88" height="5"/>
      <rect x="214" y="114" width="52" height="5"/>
      <rect x="214" y="108" width="52" height="5"/>
      <rect x="214" y="102" width="52" height="5"/>
      <rect x="214" y="96" width="52" height="5"/>
    </g>
    <!-- portique + tête d'impression -->
    <g class="gantry">
      <path d="M151 88h178" stroke-width="1.5"/>
      <g class="head">
        <rect x="227" y="70" width="26" height="18" fill="#e2562b" stroke="#e2562b"/>
        <path d="M240 88v6" stroke="#e2562b" stroke-width="1.6"/>
        <circle class="drip" cx="240" cy="97" r="2.4" fill="#e2562b" stroke="none"/>
      </g>
    </g>
    <!-- cote hauteur de fabrication -->
    <path d="M348 96h12M348 156h12M354 96v60" stroke="#e2562b" stroke-width="1.4"/>
    <!-- cote encombrement -->
    <path d="M142 188h196M142 182v12M338 182v12" stroke-width="1.2"/>
  </g>
  <text x="22" y="176" font-family="'Space Mono',ui-monospace,monospace" font-size="11" fill="#5b6066">BAMBULAB X1C</text>
  <text x="22" y="190" font-family="'Space Mono',ui-monospace,monospace" font-size="11" fill="#5b6066">256 mm&#179;</text>
  <text x="366" y="130" font-family="'Space Mono',ui-monospace,monospace" font-size="10" fill="#e2562b">Z</text>
</svg>
