<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="Schéma animé d'une graveuse laser vue de dessus : la traverse descend et la gravure apparaît au passage du faisceau">
  <defs>
    <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line y2="6" stroke="#1b1c1e" stroke-opacity=".12"/>
    </pattern>
    <clipPath id="burnt">
      <rect class="reveal" x="146" y="44" width="188" height="102"/>
    </clipPath>
  </defs>
  <style>
    /* Cycle de 8 s : la traverse balaie la planche du haut vers le bas et
       la gravure se révèle exactement derrière le faisceau. */
    .gantry { animation: jdPass 8s linear infinite; }
    .reveal { animation: jdBurn 8s linear infinite; }
    .mark   { animation: jdClear 8s linear infinite; }
    .head   { animation: jdSweep 1.3s ease-in-out infinite alternate; }
    .beam   { transform-box: view-box; transform-origin: 240px 43px; animation: jdPulse .55s ease-in-out infinite alternate; }
    @keyframes jdPass  { 0%, 4% { transform: translateY(0); } 82%, 90% { transform: translateY(102px); } 100% { transform: translateY(0); } }
    @keyframes jdBurn  { 0%, 4% { transform: translateY(-102px); } 82%, 100% { transform: translateY(0); } }
    @keyframes jdClear { 0%, 84% { opacity: 1; } 93%, 100% { opacity: 0; } }
    @keyframes jdSweep { from { transform: translateX(-88px); } to { transform: translateX(88px); } }
    @keyframes jdPulse { from { transform: scale(.65); opacity: .5; } to { transform: scale(1.3); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .gantry, .reveal, .mark, .head, .beam { animation: none; }
    }
  </style>
  <g fill="none" stroke="#1b1c1e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-.6 240 100)">
    <!-- bâti et zone de travail -->
    <rect x="104" y="20" width="272" height="150"/>
    <rect x="114" y="30" width="252" height="130" stroke-width="1.3" stroke-dasharray="5 6"/>
    <!-- planche -->
    <rect x="146" y="44" width="188" height="102" fill="url(#h)" stroke-width="1.8"/>
    <!-- motif gravé, révélé au passage du faisceau -->
    <g class="mark" clip-path="url(#burnt)" stroke-width="1.6">
      <path d="M162 62h64M162 76h96M162 90h48"/>
      <path d="M296 66l14 14-14 14-14-14z" stroke="#e2562b"/>
      <path d="M162 112h108M162 128h56"/>
    </g>
    <!-- traverse mobile + tête laser -->
    <g class="gantry">
      <path d="M114 43h252" stroke-width="1.5"/>
      <g class="head">
        <rect x="227" y="30" width="26" height="26" fill="#e2562b" stroke="#e2562b"/>
        <circle class="beam" cx="240" cy="43" r="4.5" fill="#fcfcfb" stroke="none"/>
      </g>
    </g>
    <!-- cote encombrement -->
    <path d="M104 186h272M104 180v12M376 180v12" stroke-width="1.2"/>
  </g>
  <text x="22" y="176" font-family="'Space Mono',ui-monospace,monospace" font-size="11" fill="#5b6066">GRAVURE</text>
  <text x="22" y="190" font-family="'Space Mono',ui-monospace,monospace" font-size="11" fill="#5b6066">DÉCOUPE</text>
</svg>
